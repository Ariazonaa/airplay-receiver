[package]
name = "airplay"
version = "0.1.0"
edition = "2024"
description = "Low-latency AirPlay screen mirroring receiver for Windows"
license = "GPL-3.0-only"
repository = "https://github.com/Ariazonaa/airplay-receiver"
readme = "README.md"
authors = ["Ariazonaa"]
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "airplay"
path = "src/main.rs"

[[bin]]
name = "airplay-probe"
path = "src/bin/airplay-probe.rs"

[dependencies]
egui = { version = "0.37.0", features = ["default_fonts"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media", "Win32_NetworkManagement_Dns", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFirewall", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Ole", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell"] }
sdl3-sys = { version = "0.7.3", default-features = false, features = ["use-pkg-config"] }

[build-dependencies]
bindgen = "0.73.2"
cc = "1.11.2"
pkg-config = "0.3.34"
