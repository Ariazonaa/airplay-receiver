name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Clippy, Tests (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-sdl3

      - name: Cache cargo and target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-ucrt64-ci-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ucrt64-ci-

      - name: Toolchain
        run: |
          which cargo cargo-clippy
          rustc -vV

      - name: Build
        run: cargo build --all-targets --locked

      - name: Clippy
        run: cargo-clippy clippy --all-targets -- -D warnings

      # No GPU, no audio device, port 7000 not guaranteed: tests that need real GPU
      # hardware or the receiver's network setup report "WARNUNG: ... übersprungen".
      - name: Tests
        run: AIRPLAY_CI=1 cargo test --locked
